<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Galería multimedia de Anghelo Rico con CSS Grid.">
    <title>Galería | Anghelo Rico</title>
    
    <link rel="icon" type="image/x-icon" href="img/logo.ico">
    <link rel="stylesheet" href="css/styles.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <aside id="sidebar">
        <!-- BOTÓN PEGADO AL BORDE DEL MENÚ -->
        <button id="toggleSidebar" class="btn-toggle-sidebar" title="Ocultar/Mostrar menú">
            <i class="fa-solid fa-chevron-left" id="toggleIcon"></i>
        </button>

        <h2><i class="fa-solid fa-user-graduate"></i> Diego Guevara</h2>
        <nav>
            <a href="index.html"><i class="fa-solid fa-house"></i> Inicio</a>
            <a href="sobre.html"><i class="fa-solid fa-address-card"></i> Sobre mí</a>
            <a href="proyectos.html"><i class="fa-solid fa-laptop-code"></i> Proyectos</a>
            <a href="formulario.html"><i class="fa-solid fa-file-lines"></i> Formulario</a>
            <a href="blog.html"><i class="fa-solid fa-blog"></i> Blog</a>
            <a href="galeria.html" class="active"><i class="fa-solid fa-image"></i> Galería</a>
            <a href="contacto.html"><i class="fa-solid fa-envelope"></i > Contacto</a>
        </nav>
    </aside>

    <div class="content" id="mainContent">
        <header class="scroll-animate">
            <h1><i class="fa-solid fa-image"></i> Galería Multimedia</h1>
            <p>Mis archivos multimedia - Fotos</p>
        </header>

        <main class="scroll-animate">
            <h2><i class="fa-solid fa-photo-film"></i> Mis Archivos Multimedia</h2>

            <div class="gallery-grid">
                <div class="grid-item slot-1" data-img="img/retrato_01_elegante.png" data-caption="Foto de perfil">
                    <img src="img/retrato_01_elegante.png" alt="Foto perfil" class="float-1">
                </div>

                <div class="grid-item slot-2" data-img="img/retrato_02_programando.png" data-caption="Programando">
                    <img src="img/retrato_02_programando.png" alt="Programando con gato" class="float-2">
                </div>

                <div class="slot-right-pair">
                    <div class="grid-item slot-4" data-img="img/retrato_03_creativo" data-caption="Gatito">
                        <img src="img/retrato_03_creativo.png" alt="Gato" class="float-4">
                    </div>
                    <div class="grid-item slot-5" data-img="img/retrati_04_ejecutivo" data-caption="Anghelo">
                        <img src="img/retrato_04_ejecutivo.png" alt="Anghelo" class="float-5">
                    </div>
                </div>

                <div class="grid-item slot-nueva-vert-1" data-img="img/retrato_05_estudiando.png" data-caption="Paisaje">
                    <img src="img/retrato_05_estudiando.png" alt="Nueva foto vertical 1" class="float-6">
                </div>

                <div class="grid-item slot-nueva-horiz-1" data-img="img/retrato_06_urbano" data-caption="Con amigos">
                    <img src="img/retrato_06_urbano.png" alt="Nueva foto horizontal 1" class="float-7">
                </div>
        </main>

        <footer>
            <p>&copy; 2026 Diego Guevara - Derechos reservados.</p>
        </footer>
    </div>

    <div class="modal" id="imageModal">
        <div class="modal-content">
            <div class="modal-nav modal-prev" id="prevBtn">
                <i class="fa-solid fa-chevron-left"></i>
            </div>
            <div class="close-btn" id="closeBtn">
                <i class="fa-solid fa-xmark"></i>
            </div>
            <img src="" alt="Vista ampliada" class="modal-img" id="modalImg">
            <div class="modal-nav modal-next" id="nextBtn">
                <i class="fa-solid fa-chevron-right"></i>
            </div>
            <div class="modal-caption" id="modalCaption"></div>
        </div>
    </div>

    <script>
        const observerOptions = { root: null, rootMargin: '0px', threshold: 0.15 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) { entry.target.classList.add('visible'); }
                else { entry.target.classList.remove('visible'); }
            });
        }, observerOptions);
        document.querySelectorAll('.scroll-animate').forEach(el => { observer.observe(el); });

        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const modalCaption = document.getElementById('modalCaption');
        const closeBtn = document.getElementById('closeBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        const galleryItems = document.querySelectorAll('.grid-item[data-img]');
        const images = Array.from(galleryItems).map(item => ({
            src: item.dataset.img,
            caption: item.dataset.caption
        }));
        let currentIndex = 0;

        galleryItems.forEach((item, index) => {
            item.addEventListener('click', function(e) {
                if (e.target.tagName === 'AUDIO' || e.target.closest('audio')) return;
                currentIndex = index;
                openModal(images[index].src, images[index].caption);
            });
        });

        function openModal(src, caption) {
            modalImg.src = src;
            modalCaption.textContent = caption;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function showPrev() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            modalImg.src = images[currentIndex].src;
            modalCaption.textContent = images[currentIndex].caption;
        }

        function showNext() {
            currentIndex = (currentIndex + 1) % images.length;
            modalImg.src = images[currentIndex].src;
            modalCaption.textContent = images[currentIndex].caption;
        }

        closeBtn.addEventListener('click', closeModal);
        prevBtn.addEventListener('click', showPrev);
        nextBtn.addEventListener('click', showNext);

        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (!modal.classList.contains('active')) return;
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowLeft') showPrev();
            if (e.key === 'ArrowRight') showNext();
        });

                // Lógica para Ocultar / Mostrar la Barra Lateral
        const toggleBtn = document.getElementById('toggleSidebar');
        const sidebar = document.getElementById('sidebar');
        const content = document.getElementById('mainContent');
        const toggleIcon = document.getElementById('toggleIcon');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            content.classList.toggle('expanded');
            
            // Cambia el icono de la flecha dependiendo de si está oculto o desplegado
            if (sidebar.classList.contains('collapsed')) {
                toggleIcon.className = 'fa-solid fa-chevron-right';
            } else {
                toggleIcon.className = 'fa-solid fa-chevron-left';
            }
        });
    </script>
</body>
</html>
